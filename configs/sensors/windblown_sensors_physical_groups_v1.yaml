sensors:
  # Five independently powered physical instrument groups verified from the
  # delivered system. Costs are dimensionless fixed per-epoch acquisition
  # package loads, not raw device watts and not policy-controlled frequencies.
  # Each package includes the configured instrument draw plus its fixed logger,
  # interface, conversion, and within-epoch acquisition load.
  - sensor_id: gmx500_weather_station
    variables: [wind_speed_ms, wind_direction_deg, air_temperature_c, relative_humidity, air_pressure_pa]
    refresh_interval: 1
    power_cost: 1.00
    startup_peak_power: 1.20
    warmup_steps: 0
    noise_std: {wind_speed_ms: 0.18, wind_direction_deg: 1.80, air_temperature_c: 0.18, relative_humidity: 0.90, air_pressure_pa: 14.0}

  - sensor_id: lps10_pyranometer
    variables: [solar_radiation_wm2]
    refresh_interval: 1
    power_cost: 0.75
    startup_peak_power: 0.90
    warmup_steps: 0
    noise_std: {solar_radiation_wm2: 8.0}

  - sensor_id: si111_surface_ir
    variables: [snow_surface_temperature_c]
    refresh_interval: 1
    power_cost: 0.75
    startup_peak_power: 0.90
    warmup_steps: 1
    noise_std: {snow_surface_temperature_c: 0.25}

  - sensor_id: parsivel2_disdrometer
    variables: [snow_particle_mean_diameter_mm, snow_particle_mean_velocity_ms]
    refresh_interval: 1
    power_cost: 1.10
    startup_peak_power: 1.35
    warmup_steps: 2
    noise_std: {snow_particle_mean_diameter_mm: 0.16, snow_particle_mean_velocity_ms: 0.45}

  - sensor_id: flowcapt_fc4
    variables: [snow_mass_flux_kg_m2_s]
    refresh_interval: 1
    power_cost: 0.75
    startup_peak_power: 0.90
    warmup_steps: 1
    noise_std: {snow_mass_flux_kg_m2_s: 8.0e-07}
