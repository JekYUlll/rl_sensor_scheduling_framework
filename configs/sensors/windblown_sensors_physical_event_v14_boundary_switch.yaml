sensors:
  # v14 boundary-switch calibration over v10/v11.
  #
  # Design intent:
  # - force a real event/non-event tradeoff near B=0.60--0.65;
  # - keep met+SPC and met/context+FC4 feasible as complementary masks;
  # - make the seed42 shortcut radiometer+ultrasonic+shielded+SPC infeasible;
  # - keep SPC useful outside events but fragile during blowing-snow events.
  - sensor_id: met_station_core
    variables:
      - wind_speed_ms
      - wind_direction_deg
      - air_temperature_c
      - relative_humidity
      - air_pressure_pa
    refresh_interval: 1
    power_cost: 0.12
    startup_peak_power: 0.16
    warmup_steps: 0
    noise_std:
      wind_speed_ms: 0.20
      wind_direction_deg: 2.00
      air_temperature_c: 0.20
      relative_humidity: 1.00
      air_pressure_pa: 15.0

  - sensor_id: radiometer_basic
    variables:
      - solar_radiation_wm2
    refresh_interval: 1
    power_cost: 0.05
    startup_peak_power: 0.07
    warmup_steps: 0
    noise_std:
      solar_radiation_wm2: 8.0

  - sensor_id: surface_temp_ir
    variables:
      - snow_surface_temperature_c
    refresh_interval: 1
    power_cost: 0.08
    startup_peak_power: 0.10
    warmup_steps: 1
    noise_std:
      snow_surface_temperature_c: 0.20

  - sensor_id: ultrasonic_anemometer_hd
    variables:
      - wind_speed_ms
      - wind_direction_deg
    refresh_interval: 1
    power_cost: 0.10
    startup_peak_power: 0.13
    warmup_steps: 0
    noise_std:
      wind_speed_ms: 0.08
      wind_direction_deg: 0.80

  - sensor_id: shielded_thermo_hygro
    variables:
      - air_temperature_c
      - relative_humidity
    refresh_interval: 2
    power_cost: 0.10
    startup_peak_power: 0.13
    warmup_steps: 0
    noise_std:
      air_temperature_c: 0.08
      relative_humidity: 0.40

  - sensor_id: snow_particle_counter
    variables:
      - snow_particle_mean_diameter_mm
      - snow_particle_mean_velocity_ms
    refresh_interval: 3
    power_cost: 0.46
    startup_peak_power: 0.60
    warmup_steps: 2
    noise_std:
      snow_particle_mean_diameter_mm: 0.07
      snow_particle_mean_velocity_ms: 0.20
    event_noise_std:
      snow_particle_mean_diameter_mm: 0.55
      snow_particle_mean_velocity_ms: 1.80
    event_observation_probability:
      snow_particle_mean_diameter_mm: 0.18
      snow_particle_mean_velocity_ms: 0.18

  - sensor_id: laser_disdrometer
    variables:
      - snow_particle_mean_diameter_mm
      - snow_particle_mean_velocity_ms
    refresh_interval: 2
    power_cost: 1.18
    startup_peak_power: 1.50
    warmup_steps: 3
    noise_std:
      snow_particle_mean_diameter_mm: 0.025
      snow_particle_mean_velocity_ms: 0.06
    event_noise_std:
      snow_particle_mean_diameter_mm: 0.12
      snow_particle_mean_velocity_ms: 0.35
    event_observation_probability:
      snow_particle_mean_diameter_mm: 0.65
      snow_particle_mean_velocity_ms: 0.65

  - sensor_id: fc4_flux
    variables:
      - snow_mass_flux_kg_m2_s
    refresh_interval: 1
    power_cost: 0.42
    startup_peak_power: 0.54
    warmup_steps: 1
    noise_std:
      snow_mass_flux_kg_m2_s: 1.0e-06
