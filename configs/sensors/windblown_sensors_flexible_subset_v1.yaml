sensors:
  # Effective per-epoch costs include the fixed within-epoch sampling load and
  # interface overhead of each physical-system channel. Sampling frequency is
  # not a scheduling action in this configuration.
  - sensor_id: met_station_core
    variables:
      - wind_speed_ms
      - wind_direction_deg
      - air_temperature_c
      - relative_humidity
      - air_pressure_pa
    refresh_interval: 1
    power_cost: 0.40
    startup_peak_power: 0.48
    warmup_steps: 0
    noise_std:
      wind_speed_ms: 0.18
      wind_direction_deg: 1.80
      air_temperature_c: 0.18
      relative_humidity: 0.90
      air_pressure_pa: 14.0

  - sensor_id: radiometer_basic
    variables:
      - solar_radiation_wm2
    refresh_interval: 1
    power_cost: 0.28
    startup_peak_power: 0.34
    warmup_steps: 0
    noise_std:
      solar_radiation_wm2: 8.0

  - sensor_id: shielded_thermo_hygro
    variables:
      - air_temperature_c
      - relative_humidity
    refresh_interval: 1
    power_cost: 0.32
    startup_peak_power: 0.39
    warmup_steps: 0
    noise_std:
      air_temperature_c: 0.06
      relative_humidity: 0.30

  - sensor_id: surface_temp_ir
    variables:
      - snow_surface_temperature_c
      - event_subtype_thermal_latent
    refresh_interval: 1
    power_cost: 0.48
    startup_peak_power: 0.62
    warmup_steps: 1
    noise_std:
      snow_surface_temperature_c: 0.25
      event_subtype_thermal_latent: 0.30
    calm_noise_std:
      snow_surface_temperature_c: 0.32
      event_subtype_thermal_latent: 0.45
    calm_observation_probability:
      snow_surface_temperature_c: 0.92
      event_subtype_thermal_latent: 0.78
    event_noise_std:
      snow_surface_temperature_c: 0.24
      event_subtype_thermal_latent: 0.28
    event_observation_probability:
      snow_surface_temperature_c: 0.94
      event_subtype_thermal_latent: 0.86
    event_subtype_noise_std:
      particle:
        snow_surface_temperature_c: 0.22
        event_subtype_thermal_latent: 0.27
      flux:
        snow_surface_temperature_c: 0.20
        event_subtype_thermal_latent: 0.24
      thermal:
        snow_surface_temperature_c: 0.10
        event_subtype_thermal_latent: 0.08
    event_subtype_observation_probability:
      particle:
        snow_surface_temperature_c: 0.90
        event_subtype_thermal_latent: 0.82
      flux:
        snow_surface_temperature_c: 0.92
        event_subtype_thermal_latent: 0.86
      thermal:
        snow_surface_temperature_c: 0.98
        event_subtype_thermal_latent: 0.98

  - sensor_id: laser_disdrometer
    variables:
      - snow_particle_mean_diameter_mm
      - snow_particle_mean_velocity_ms
      - event_subtype_particle_latent
    refresh_interval: 1
    power_cost: 0.70
    startup_peak_power: 0.88
    warmup_steps: 2
    noise_std:
      snow_particle_mean_diameter_mm: 0.16
      snow_particle_mean_velocity_ms: 0.45
      event_subtype_particle_latent: 0.25
    calm_noise_std:
      snow_particle_mean_diameter_mm: 0.70
      snow_particle_mean_velocity_ms: 1.80
      event_subtype_particle_latent: 0.80
    calm_observation_probability:
      snow_particle_mean_diameter_mm: 0.22
      snow_particle_mean_velocity_ms: 0.22
      event_subtype_particle_latent: 0.18
    event_noise_std:
      snow_particle_mean_diameter_mm: 0.16
      snow_particle_mean_velocity_ms: 0.42
      event_subtype_particle_latent: 0.24
    event_observation_probability:
      snow_particle_mean_diameter_mm: 0.82
      snow_particle_mean_velocity_ms: 0.82
      event_subtype_particle_latent: 0.78
    event_subtype_noise_std:
      particle:
        snow_particle_mean_diameter_mm: 0.07
        snow_particle_mean_velocity_ms: 0.18
        event_subtype_particle_latent: 0.06
      flux:
        snow_particle_mean_diameter_mm: 0.12
        snow_particle_mean_velocity_ms: 0.30
        event_subtype_particle_latent: 0.16
      thermal:
        snow_particle_mean_diameter_mm: 0.22
        snow_particle_mean_velocity_ms: 0.55
        event_subtype_particle_latent: 0.34
    event_subtype_observation_probability:
      particle:
        snow_particle_mean_diameter_mm: 0.97
        snow_particle_mean_velocity_ms: 0.97
        event_subtype_particle_latent: 0.98
      flux:
        snow_particle_mean_diameter_mm: 0.90
        snow_particle_mean_velocity_ms: 0.90
        event_subtype_particle_latent: 0.86
      thermal:
        snow_particle_mean_diameter_mm: 0.68
        snow_particle_mean_velocity_ms: 0.68
        event_subtype_particle_latent: 0.58

  - sensor_id: fc4_flux
    variables:
      - snow_mass_flux_kg_m2_s
      - event_subtype_flux_latent
    refresh_interval: 1
    power_cost: 0.62
    startup_peak_power: 0.78
    warmup_steps: 1
    noise_std:
      snow_mass_flux_kg_m2_s: 8.0e-07
      event_subtype_flux_latent: 0.25
    calm_noise_std:
      snow_mass_flux_kg_m2_s: 3.0e-06
      event_subtype_flux_latent: 0.85
    calm_observation_probability:
      snow_mass_flux_kg_m2_s: 0.20
      event_subtype_flux_latent: 0.16
    event_noise_std:
      snow_mass_flux_kg_m2_s: 8.0e-07
      event_subtype_flux_latent: 0.24
    event_observation_probability:
      snow_mass_flux_kg_m2_s: 0.84
      event_subtype_flux_latent: 0.80
    event_subtype_noise_std:
      particle:
        snow_mass_flux_kg_m2_s: 7.0e-07
        event_subtype_flux_latent: 0.18
      flux:
        snow_mass_flux_kg_m2_s: 3.0e-07
        event_subtype_flux_latent: 0.06
      thermal:
        snow_mass_flux_kg_m2_s: 1.1e-06
        event_subtype_flux_latent: 0.34
    event_subtype_observation_probability:
      particle:
        snow_mass_flux_kg_m2_s: 0.88
        event_subtype_flux_latent: 0.84
      flux:
        snow_mass_flux_kg_m2_s: 0.98
        event_subtype_flux_latent: 0.98
      thermal:
        snow_mass_flux_kg_m2_s: 0.64
        event_subtype_flux_latent: 0.56
