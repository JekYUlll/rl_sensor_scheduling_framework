sensors:
  # v16 surface-boundary calibration.
  #
  # Design intent:
  # - preserve the v15 event-complementarity structure;
  # - break the residual met+surface+laser static shortcut at B=1.15;
  # - keep the intended calm pair and event pair feasible:
  #   calm  = met+radiometer+surface+SPC;
  #   event = met+radiometer+laser.
  #
  # The only structural change from v15 is a small increase in the
  # surface-temperature infrared sensor cost. This makes
  # met+surface+laser exceed the B=1.15 steady/peak boundary while leaving
  # met+radiometer+laser inside the same boundary.
  - sensor_id: met_station_core
    variables:
      - wind_speed_ms
      - wind_direction_deg
      - air_temperature_c
      - relative_humidity
      - air_pressure_pa
    refresh_interval: 1
    power_cost: 0.14
    startup_peak_power: 0.18
    warmup_steps: 0
    noise_std:
      wind_speed_ms: 0.20
      wind_direction_deg: 2.00
      air_temperature_c: 0.20
      relative_humidity: 1.00
      air_pressure_pa: 15.0

  - sensor_id: radiometer_basic
    variables:
      - solar_radiation_wm2
    refresh_interval: 1
    power_cost: 0.10
    startup_peak_power: 0.13
    warmup_steps: 0
    noise_std:
      solar_radiation_wm2: 8.0

  - sensor_id: surface_temp_ir
    variables:
      - snow_surface_temperature_c
    refresh_interval: 1
    power_cost: 0.16
    startup_peak_power: 0.20
    warmup_steps: 1
    noise_std:
      snow_surface_temperature_c: 0.20

  - sensor_id: ultrasonic_anemometer_hd
    variables:
      - wind_speed_ms
      - wind_direction_deg
    refresh_interval: 1
    power_cost: 0.16
    startup_peak_power: 0.22
    warmup_steps: 0
    noise_std:
      wind_speed_ms: 0.08
      wind_direction_deg: 0.80

  - sensor_id: shielded_thermo_hygro
    variables:
      - air_temperature_c
      - relative_humidity
    refresh_interval: 2
    power_cost: 0.15
    startup_peak_power: 0.20
    warmup_steps: 0
    noise_std:
      air_temperature_c: 0.08
      relative_humidity: 0.40

  - sensor_id: snow_particle_counter
    variables:
      - snow_particle_mean_diameter_mm
      - snow_particle_mean_velocity_ms
    refresh_interval: 3
    power_cost: 0.52
    startup_peak_power: 0.68
    warmup_steps: 2
    noise_std:
      snow_particle_mean_diameter_mm: 0.07
      snow_particle_mean_velocity_ms: 0.20
    event_noise_std:
      snow_particle_mean_diameter_mm: 0.80
      snow_particle_mean_velocity_ms: 2.40
    event_observation_probability:
      snow_particle_mean_diameter_mm: 0.12
      snow_particle_mean_velocity_ms: 0.12

  - sensor_id: laser_disdrometer
    variables:
      - snow_particle_mean_diameter_mm
      - snow_particle_mean_velocity_ms
    refresh_interval: 2
    power_cost: 0.86
    startup_peak_power: 1.18
    warmup_steps: 3
    noise_std:
      snow_particle_mean_diameter_mm: 0.025
      snow_particle_mean_velocity_ms: 0.06
    event_noise_std:
      snow_particle_mean_diameter_mm: 0.09
      snow_particle_mean_velocity_ms: 0.26
    event_observation_probability:
      snow_particle_mean_diameter_mm: 0.72
      snow_particle_mean_velocity_ms: 0.72

  - sensor_id: fc4_flux
    variables:
      - snow_mass_flux_kg_m2_s
    refresh_interval: 1
    power_cost: 0.54
    startup_peak_power: 0.70
    warmup_steps: 1
    noise_std:
      snow_mass_flux_kg_m2_s: 6.0e-07
