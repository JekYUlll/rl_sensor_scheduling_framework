sensors:
  # Fixed effective per-epoch costs for the entity-mapped sensing system.
  # These values represent a declared acquisition-duty/interface operating
  # point, not bench-calibrated absolute watts. Sampling frequency is fixed
  # within a run and is never a scheduling action.
  - sensor_id: met_station_core
    variables: [wind_speed_ms, wind_direction_deg, air_temperature_c, relative_humidity, air_pressure_pa]
    refresh_interval: 1
    power_cost: 0.30
    startup_peak_power: 0.30
    warmup_steps: 0
    noise_std: {wind_speed_ms: 0.18, wind_direction_deg: 1.80, air_temperature_c: 0.18, relative_humidity: 0.90, air_pressure_pa: 14.0}

  - sensor_id: radiometer_basic
    variables: [solar_radiation_wm2]
    refresh_interval: 1
    power_cost: 0.36
    startup_peak_power: 0.36
    warmup_steps: 0
    noise_std: {solar_radiation_wm2: 8.0}

  - sensor_id: surface_temp_ir
    variables: [snow_surface_temperature_c]
    refresh_interval: 1
    power_cost: 0.0156
    startup_peak_power: 0.0156
    warmup_steps: 1
    noise_std: {snow_surface_temperature_c: 0.25}
    calm_noise_std: {snow_surface_temperature_c: 0.32}
    event_noise_std: {snow_surface_temperature_c: 0.24}
    event_subtype_noise_std:
      particle: {snow_surface_temperature_c: 0.34}
      flux: {snow_surface_temperature_c: 0.30}
      thermal: {snow_surface_temperature_c: 0.10}
    event_subtype_observation_probability:
      particle: {snow_surface_temperature_c: 0.72}
      flux: {snow_surface_temperature_c: 0.78}
      thermal: {snow_surface_temperature_c: 0.98}

  - sensor_id: laser_disdrometer
    variables: [snow_particle_mean_diameter_mm, snow_particle_mean_velocity_ms]
    refresh_interval: 1
    power_cost: 1.50
    startup_peak_power: 1.50
    warmup_steps: 2
    noise_std: {snow_particle_mean_diameter_mm: 0.16, snow_particle_mean_velocity_ms: 0.45}
    calm_noise_std: {snow_particle_mean_diameter_mm: 0.70, snow_particle_mean_velocity_ms: 1.80}
    calm_observation_probability: {snow_particle_mean_diameter_mm: 0.22, snow_particle_mean_velocity_ms: 0.22}
    event_noise_std: {snow_particle_mean_diameter_mm: 0.16, snow_particle_mean_velocity_ms: 0.42}
    event_observation_probability: {snow_particle_mean_diameter_mm: 0.82, snow_particle_mean_velocity_ms: 0.82}
    event_subtype_noise_std:
      particle: {snow_particle_mean_diameter_mm: 0.07, snow_particle_mean_velocity_ms: 0.18}
      flux: {snow_particle_mean_diameter_mm: 0.22, snow_particle_mean_velocity_ms: 0.60}
      thermal: {snow_particle_mean_diameter_mm: 0.34, snow_particle_mean_velocity_ms: 0.80}
    event_subtype_observation_probability:
      particle: {snow_particle_mean_diameter_mm: 0.97, snow_particle_mean_velocity_ms: 0.97}
      flux: {snow_particle_mean_diameter_mm: 0.72, snow_particle_mean_velocity_ms: 0.72}
      thermal: {snow_particle_mean_diameter_mm: 0.50, snow_particle_mean_velocity_ms: 0.50}

  - sensor_id: fc4_flux
    variables: [snow_mass_flux_kg_m2_s]
    refresh_interval: 1
    power_cost: 0.06
    startup_peak_power: 0.06
    warmup_steps: 1
    noise_std: {snow_mass_flux_kg_m2_s: 8.0e-07}
    calm_noise_std: {snow_mass_flux_kg_m2_s: 3.0e-06}
    calm_observation_probability: {snow_mass_flux_kg_m2_s: 0.20}
    event_noise_std: {snow_mass_flux_kg_m2_s: 8.0e-07}
    event_observation_probability: {snow_mass_flux_kg_m2_s: 0.84}
    event_subtype_noise_std:
      particle: {snow_mass_flux_kg_m2_s: 1.2e-06}
      flux: {snow_mass_flux_kg_m2_s: 1.2e-07}
      thermal: {snow_mass_flux_kg_m2_s: 1.5e-06}
    event_subtype_observation_probability:
      particle: {snow_mass_flux_kg_m2_s: 0.68}
      flux: {snow_mass_flux_kg_m2_s: 0.995}
      thermal: {snow_mass_flux_kg_m2_s: 0.48}

  # Mandatory data logger/backbone. It is not a sensing channel and is not
  # selectable by the policy, but its fixed cost is part of feasibility.
  - sensor_id: cr1000xe_backbone
    variables: []
    refresh_interval: 1
    power_cost: 0.4104
    startup_peak_power: 0.4104
    warmup_steps: 0
    noise_std: {}
