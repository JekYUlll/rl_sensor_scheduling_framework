sensors:
  # Effective per-epoch costs include the fixed acquisition, conditioning, and
  # interface load of each deployed channel. They are not sampling frequencies.
  # The multi-variable GMX500 channel therefore carries a higher bundled load
  # than in v6, preventing it from being a cost-free permanent backbone.
  - sensor_id: met_station_core
    variables: [wind_speed_ms, wind_direction_deg, air_temperature_c, relative_humidity, air_pressure_pa]
    refresh_interval: 1
    power_cost: 1.02
    startup_peak_power: 1.20
    warmup_steps: 0
    noise_std: {wind_speed_ms: 0.18, wind_direction_deg: 1.80, air_temperature_c: 0.18, relative_humidity: 0.90, air_pressure_pa: 14.0}

  - sensor_id: radiometer_basic
    variables: [solar_radiation_wm2]
    refresh_interval: 1
    power_cost: 0.75
    startup_peak_power: 0.88
    warmup_steps: 0
    noise_std: {solar_radiation_wm2: 8.0}

  - sensor_id: shielded_thermo_hygro
    variables: [air_temperature_c, relative_humidity]
    refresh_interval: 1
    power_cost: 0.80
    startup_peak_power: 0.96
    warmup_steps: 0
    noise_std: {air_temperature_c: 0.06, relative_humidity: 0.30}

  - sensor_id: surface_temp_ir
    variables: [snow_surface_temperature_c]
    refresh_interval: 1
    power_cost: 0.85
    startup_peak_power: 1.03
    warmup_steps: 1
    noise_std: {snow_surface_temperature_c: 0.25}

  - sensor_id: laser_disdrometer
    variables: [snow_particle_mean_diameter_mm, snow_particle_mean_velocity_ms]
    refresh_interval: 1
    power_cost: 1.00
    startup_peak_power: 1.23
    warmup_steps: 2
    noise_std: {snow_particle_mean_diameter_mm: 0.16, snow_particle_mean_velocity_ms: 0.45}

  - sensor_id: fc4_flux
    variables: [snow_mass_flux_kg_m2_s]
    refresh_interval: 1
    power_cost: 0.95
    startup_peak_power: 1.14
    warmup_steps: 1
    noise_std: {snow_mass_flux_kg_m2_s: 8.0e-07}
