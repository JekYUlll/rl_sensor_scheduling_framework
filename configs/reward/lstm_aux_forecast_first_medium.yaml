predictor_cfgs:
  - predictor_cfg: configs/predictor/tcn_reward_medium.yaml
    model_name: tcn
    weight: 1.0
pretrain_split: predictor_pretrain
lookback: 20
horizon: 8
horizon_weights: [1.0, 0.95, 0.9, 0.85, 0.8, 0.75, 0.7, 0.65]
loss: huber
loss_delta: 1.0
history_source: scheduler_mix
input_columns: all_state_columns
target_columns:
  - air_temperature_c
  - snow_surface_temperature_c
  - wind_speed_ms
  - wind_dir_sin
  - wind_dir_cos
  - solar_radiation_wm2
  - snow_particle_mean_diameter_mm
  - snow_mass_flux_kg_m2_s
  - snow_particle_mean_velocity_ms
pretrain_schedulers:
  - full_open
  - periodic
  - round_robin
  - warmup_round_robin
  - info_priority
  - random
pretrain_rollouts_per_scheduler: 6
pretrain_episode_len: 2048
pretrain_random_reset: true
pretrain_all_feasible_subsets: true
pretrain_max_feasible_constant_rollouts: 32
pretrain_random_subset_rollouts: 16
pretrain_random_subset_hold_min: 2
pretrain_random_subset_hold_max: 12
train_ratio_within_pretrain: 0.85
val_ratio_within_pretrain: 0.05
