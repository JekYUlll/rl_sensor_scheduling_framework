scheduler_name: cmdp_dqn
device: auto
network:
  hidden_dims: [64, 64]
training:
  gamma: 0.99
  lr: 0.001
  batch_size: 32
  replay_size: 10000
  warmup_steps: 64
  target_update_interval: 50
  train_interval: 1
  grad_clip: 5.0
exploration:
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 800
reward_normalization:
  enabled: false
  clip: 10.0
cmdp:
  average_power_budget: null
  episode_energy_budget: null
  lambda_avg_init: 0.0
  lambda_energy_init: 0.0
  dual_lr_avg: 0.1
  dual_lr_energy: 0.001
  lambda_max: 100.0
  normalize_power: true
  power_reference: 2.0
  lambda_power_in_reward: 0.0
