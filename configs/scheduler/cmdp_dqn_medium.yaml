scheduler_name: cmdp_dqn
device: auto
network:
  hidden_dims: [128, 128]
training:
  gamma: 0.99
  lr: 0.001
  batch_size: 64
  replay_size: 50000
  warmup_steps: 500
  target_update_interval: 200
  train_interval: 1
  grad_clip: 5.0
exploration:
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 6000
reward_normalization:
  enabled: false
  clip: 10.0
cmdp:
  # CMDP is only meaningful when a long-horizon resource constraint is active.
  # The hard projector still enforces instantaneous rated power; this budget
  # limits average deployment energy without making power saving the objective.
  average_power_budget: 1.35
  episode_energy_budget: null
  lambda_avg_init: 0.0
  lambda_energy_init: 0.0
  dual_lr_avg: 0.03
  dual_lr_energy: 0.001
  lambda_max: 20.0
  violation_ema_beta: 0.8
  normalize_power: true
  power_reference: 2.0
  lambda_power_in_reward: 0.0
