predictor_name: tcn
channels: [16, 16]
kernel_size: 3
epochs: 2
lr: 0.001
batch_size: 64
use_observed_mask: true
use_time_delta: true
time_delta:
  encoding: log_capped
  cap_steps: 600
  prefix: staleness
context_features:
  - trace_p
  - log_trace_p
input_filter:
  type: causal_moving_average
  window: 3
  columns:
    - air_temperature_c
    - snow_surface_temperature_c
    - wind_speed_ms
    - solar_radiation_wm2
    - snow_particle_mean_diameter_mm
    - snow_mass_flux_kg_m2_s
    - snow_particle_mean_velocity_ms
